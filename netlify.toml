# -----------------------------------------------------------------------------
# Netlify — déploiement du site 100 % statique « Hommage à Papa ».
# Recette : connectez le dépôt GitHub sur Netlify → Import from Git.
# Netlify lit ce fichier : build `npm run build`, publication du dossier `out/`.
# -----------------------------------------------------------------------------
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"